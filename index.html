<!-- KELABANG RAKSASA / KOMANDAN -->
<style>
#kelabangCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 99998;
  pointer-events: none;
}
#kelabangBtn {
  position: fixed;
  right: 18px;
  bottom: 20px;
  z-index: 99999;
  background: #211407;
  color: #ffc45c;
  border: 1px solid #c98228;
  border-radius: 10px;
  padding: 11px 16px;
  font-weight: bold;
  cursor: pointer;
  font-family: monospace;
}
</style>

<canvas id="kelabangCanvas"></canvas>
<button id="kelabangBtn">🐛 KELABANG: ON</button>

<script>
(function () {
  const canvas = document.getElementById("kelabangCanvas");
  const ctx = canvas.getContext("2d");
  const btn = document.getElementById("kelabangBtn");

  let W, H, dpr, active = true;
  let x = 150, y = 250, angle = 0, phase = 0;
  let targetX = 500, targetY = 350;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  addEventListener("resize", resize);
  resize();

  function chooseTarget() {
    targetX = 80 + Math.random() * (W - 160);
    targetY = 100 + Math.random() * (H - 200);
  }

  function drawCentipede() {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    const size = 2.4;

    // Bayangan dan aura
    ctx.shadowColor = "#ff8c24";
    ctx.shadowBlur = 22;

    // Kaki
    for (let i = 0; i < 18; i++) {
      const px = -i * 10 * size;
      const wave = Math.sin(phase * 0.18 - i * 0.7);

      for (const side of [-1, 1]) {
        const sway = wave * 7 * size;
        ctx.beginPath();
        ctx.moveTo(px, side * 4 * size);
        ctx.lineTo(px - 4 * size, side * (13 * size + sway));
        ctx.lineTo(px - 10 * size, side * (19 * size + sway));
        ctx.strokeStyle = "#6e2812";
        ctx.lineWidth = 2.7 * size;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(
          px - 10 * size,
          side * (19 * size + sway),
          1.3 * size,
          0,
          Math.PI * 2
        );
        ctx.fillStyle = "#ffb34e";
        ctx.fill();
      }
    }

    // Tubuh beruas
    for (let i = 17; i >= 0; i--) {
      const px = -i * 10 * size;
      const py = Math.sin(phase * 0.09 - i * 0.5) * 2 * size;

      const gradient = ctx.createRadialGradient(
        px + 3 * size, py - 3 * size, 1,
        px, py, 8 * size
      );

      gradient.addColorStop(0, "#ffbd58");
      gradient.addColorStop(0.45, "#d56820");
      gradient.addColorStop(1, "#65200d");

      ctx.beginPath();
      ctx.ellipse(
        px, py,
        8 * size, 6 * size,
        0, 0, Math.PI * 2
      );
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.strokeStyle = "#ffca76";
      ctx.lineWidth = 0.8 * size;
      ctx.stroke();
    }

    // Kepala
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.ellipse(9 * size, 0, 10 * size, 8 * size, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#f49a36";
    ctx.fill();

    // Mata
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(14 * size, side * 4 * size, 2 * size, 0, Math.PI * 2);
      ctx.fillStyle = "#fff1a6";
      ctx.fill();
    }

    // Antena
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(15 * size, side * 3 * size);
      ctx.quadraticCurveTo(
        25 * size, side * 12 * size,
        30 * size, side * 8 * size
      );
      ctx.strokeStyle = "#ffbd58";
      ctx.lineWidth = 1.8 * size;
      ctx.stroke();
    }

    ctx.restore();

    // Label komandan
    ctx.save();
    ctx.font = "bold 13px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffc45c";
    ctx.shadowColor = "#ff8c24";
    ctx.shadowBlur = 10;
    ctx.fillText("🐛 KELABANG KOMANDAN", x, y - 65);
    ctx.restore();
  }

  function animate() {
    requestAnimationFrame(animate);
    if (!active) return;

    ctx.clearRect(0, 0, W, H);

    const dx = targetX - x;
    const dy = targetY - y;
    const distance = Math.hypot(dx, dy);

    if (distance < 15) {
      chooseTarget();
    } else {
      angle = Math.atan2(dy, dx);
      x += Math.cos(angle) * 1.7;
      y += Math.sin(angle) * 1.7;
    }

    phase += 1;
    drawCentipede();
  }

  btn.onclick = function () {
    active = !active;
    btn.textContent = active
      ? "🐛 KELABANG: ON"
      : "🐛 KELABANG: OFF";

    if (!active) {
      ctx.clearRect(0, 0, W, H);
    }
  };

  chooseTarget();
  animate();
})();
</script>
